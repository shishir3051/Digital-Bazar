services:
  - type: web
    name: digital-bazar-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: digital_bazar
      - key: JWT_SECRET
        generateValue: true
      - key: USD_TO_BDT_RATE
        value: "108.0"
