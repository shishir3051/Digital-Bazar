services:
  - type: web
    name: digital-bazar-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: digital_bazar
      - key: JWT_SECRET
        generateValue: true
      - key: USD_TO_BDT_RATE
        value: "108.0"
